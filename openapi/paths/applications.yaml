get:
    operationId: listApplications
    summary: List all applications
    description: Retrieve a paginated list of all active applications
    tags:
        - Applications
    parameters:
        - name: page
          in: query
          description: Page number
          schema:
              type: integer
              minimum: 1
              default: 1
          example: 1
        - name: limit
          in: query
          description: Items per page
          schema:
              type: integer
              minimum: 1
              maximum: 100
              default: 100
          example: 100
    responses:
        "200":
            description: List of applications
            content:
                application/json:
                    schema:
                        type: object
                        required:
                            - data
                            - pagination
                        properties:
                            data:
                                type: array
                                items:
                                    $ref: "../components/schemas/Application.yaml"
                            pagination:
                                type: object
                                required:
                                    - total
                                    - page
                                    - limit
                                    - pages
                                properties:
                                    total:
                                        type: integer
                                        example: 75
                                    page:
                                        type: integer
                                        example: 1
                                    limit:
                                        type: integer
                                        example: 100
                                    pages:
                                        type: integer
                                        example: 1
            headers:
                X-Request-Id:
                    schema:
                        type: string
                        format: uuid
        "500":
            $ref: "../components/responses/InternalServerError.yaml"

post:
    operationId: createApplication
    summary: Create a new application
    description: Create a new application
    tags:
        - Applications
    requestBody:
        required: true
        content:
            application/json:
                schema:
                    $ref: "../components/schemas/ApplicationInput.yaml"
                example:
                    clientId: ""
                    term: 30
                    amount: "3000.00"
                    currency: "EUR"
    responses:
        "201":
            description: Application created successfully
            content:
                application/json:
                    schema:
                        $ref: "../components/schemas/Application.yaml"
            headers:
                X-Request-Id:
                    schema:
                        type: string
                        format: uuid
        "404":
            description: Client not found
            $ref: "../components/responses/ApplicationNotFound.yaml"
        "422":
            $ref: "../components/responses/UnprocessableEntity.yaml"
        "500":
            $ref: "../components/responses/InternalServerError.yaml"
