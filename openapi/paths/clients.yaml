get:
    operationId: listClients
    summary: List all clients
    description: Retrieve a paginated list of all active clients
    tags:
        - Clients
    parameters:
        - name: page
          in: query
          description: Page number
          schema:
              type: integer
              minimum: 1
              default: 1
          example: 1
        - name: limit
          in: query
          description: Items per page
          schema:
              type: integer
              minimum: 1
              maximum: 100
              default: 100
          example: 100
    responses:
        "200":
            description: List of clients
            content:
                application/json:
                    schema:
                        type: object
                        required:
                            - data
                            - pagination
                        properties:
                            data:
                                type: array
                                items:
                                    $ref: "../components/schemas/Client.yaml"
                            pagination:
                                type: object
                                required:
                                    - total
                                    - page
                                    - limit
                                    - pages
                                properties:
                                    total:
                                        type: integer
                                        example: 75
                                    page:
                                        type: integer
                                        example: 1
                                    limit:
                                        type: integer
                                        example: 100
                                    pages:
                                        type: integer
                                        example: 1
            headers:
                X-Request-Id:
                    schema:
                        type: string
                        format: uuid
                    description: Request ID
        "500":
            $ref: "../components/responses/InternalServerError.yaml"

post:
    operationId: createClient
    summary: Create a new client
    description: Create a new client
    tags:
        - Clients
    requestBody:
        required: true
        content:
            application/json:
                schema:
                    $ref: "../components/schemas/ClientInput.yaml"
                example:
                    firstName: "John"
                    lastName: "Doe"
                    email: "john.doe@mail.com"
                    phoneNumber: "+37101234567"
    responses:
        "201":
            description: Client created successfully
            content:
                application/json:
                    schema:
                        $ref: "../components/schemas/Client.yaml"
            headers:
                X-Request-Id:
                    schema:
                        type: string
                        format: uuid
        "409":
            $ref: "../components/responses/Conflict.yaml"
        "422":
            $ref: "../components/responses/UnprocessableEntity.yaml"
        "500":
            $ref: "../components/responses/InternalServerError.yaml"
