get:
    operationId: healthCheck
    summary: Health check
    description: Check if the API is healthy
    tags:
        - Health
    responses:
        "200":
            description: API is healthy
            content:
                application/json:
                    schema:
                        type: object
                        properties:
                            status:
                                type: string
                                example: "ok"
            headers:
                X-Request-Id:
                    schema:
                        type: string
                        format: uuid
